name: Bug report
description: Report a reproducible problem in the Scient agent source foundation
title: "[BUG]: "
body:
  - type: markdown
    attributes:
      value: |
        This repository contains the planned native Scient agent's source foundation. Current desktop application issues belong in `ScientFactory/scient-desktop`.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened and what you expected instead.
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Scient agent source revision
      description: Provide the commit SHA or branch where the problem occurs.
      placeholder: 40-character commit SHA
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repeatable sequence and relevant configuration with secrets removed.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: upstream
    attributes:
      label: Upstream comparison
      description: If checked, say whether the issue also reproduces in official OpenCode.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS, Linux, or Windows version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include only bounded, redacted output. Do not paste credentials or private data.
      render: shell
    validations:
      required: false
