name: Feature request
description: Propose a bounded improvement to the Scient agent source foundation
title: "[FEATURE]: "
body:
  - type: markdown
    attributes:
      value: |
        The native Scient agent remains planned. Describe the source capability and evidence needed without presenting proposed product behavior as implemented.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete source-foundation or native-agent problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful behavior and its verification boundary.
    validations:
      required: true

  - type: dropdown
    id: lane
    attributes:
      label: Source lane
      options:
        - Reliability or security
        - Provider or protocol compatibility
        - Native Scient agent capability
        - Inherited core maintenance
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and upstream context
      description: Note affected inherited identifiers, upstream behavior, or desktop coupling.
    validations:
      required: false
