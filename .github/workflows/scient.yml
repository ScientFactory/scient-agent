name: Scient Agent

# Builds Scient Agent for every platform it supports on every push to main and
# every pull request into it, and checks that each build keeps its state apart
# from a stock omp. The macOS builds are signed on Linux by upstream's
# scripts/ci-macos-sign.sh, ad hoc on every run so the signing path is always
# exercised, then checked on macOS. A manual run on main with `release` set
# builds scient.json's version, signs the macOS builds with the Developer ID,
# notarizes them and, once every job passed, drafts a GitHub release with every
# binary and its checksum; a person publishes the draft, which creates the tag.
# As in Scient Desktop's release, a version is used up only when it is
# published: after a failed or superseded run, run again with the same version.
# A manual run can also sign and notarize without drafting a release, to
# qualify the signing secrets. Oh My Pi's own test suite runs on Linux against
# Scient's tree, as upstream's CI runs it.

on:
   push:
      branches: ["main", "scient/**"]
   pull_request:
      branches: ["main"]
   workflow_dispatch:
      inputs:
         release:
            description: Release scient.json's version from main (it must come right after the latest published release)
            type: boolean
            default: false
         developer-id:
            description: Sign the macOS builds with the Developer ID and notarize them (no release is drafted)
            type: boolean
            default: false

permissions:
   contents: read

concurrency:
   # A manual run never cancels, or is cancelled by, a push to the same branch.
   # A release run is never cancelled: a second one waits for it.
   group: scient-${{ (github.event_name == 'workflow_dispatch' && inputs.release) && 'release' || format('{0}-{1}', github.ref, github.event_name == 'workflow_dispatch' && 'manual' || 'auto') }}
   cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release) }}

env:
   # A release is a manual run with `release` set; the release-version job refuses any branch but main.
   RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
   DEVELOPER_ID: ${{ github.event_name == 'workflow_dispatch' && (inputs.release == true || inputs.developer-id == true) }}

defaults:
   run:
      # Windows runners default to PowerShell.
      shell: bash

jobs:
   # A release builds scient.json's version only if it comes right after the
   # latest published release and is not tagged yet (scripts/scient/release-version.ts).
   # The release job checks again before it drafts.
   release-version:
      name: Check the release version
      # Job conditions cannot read workflow env, so this repeats RELEASE.
      if: github.event_name == 'workflow_dispatch' && inputs.release
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      outputs:
         version: ${{ steps.check.outputs.version }}
      steps:
         - name: Release from main only
           run: |
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                 echo "::error::A release is built from main, not $GITHUB_REF."
                 exit 1
              fi

         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.4

         - id: check
           name: Check the version
           env:
              GH_TOKEN: ${{ github.token }}
           run: bun scripts/scient/release-version.ts

   build:
      name: Build and check (${{ matrix.id }})
      runs-on: ${{ matrix.runner }}
      timeout-minutes: 150
      strategy:
         fail-fast: false
         matrix:
            include:
               # Xcode 27's macOS 27 SDK builds the Apple Foundation Models bridge, which
               # macos-15 lacks; the addon still targets macOS 12 (.bazelrc), and the
               # signed build is checked on macos-15.
               - { id: darwin-arm64, runner: xcode-27, x64: false }
               - { id: darwin-x64, runner: macos-15-intel, x64: true }
               - { id: linux-x64, runner: ubuntu-22.04, x64: true }
               - { id: linux-arm64, runner: ubuntu-22.04-arm, x64: false }
               - { id: windows-x64, runner: windows-2022, x64: true }
               - { id: windows-arm64, runner: windows-11-arm, x64: false }
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.4

         # Before any step changes a tracked file, so a clean checkout is not reported dirty.
         - name: Stamp the build id
           run: bun scripts/scient/stamp-build-id.ts

         - name: Install build tools
           run: |
              case "$RUNNER_OS" in
                 macOS) brew install ninja ;;
                 Linux) sudo apt-get update && sudo apt-get install -y ninja-build ;;
                 Windows) choco install ninja -y --no-progress ;;
              esac
              rustup show active-toolchain || rustup toolchain install

         - name: Install dependencies
           run: bun install --frozen-lockfile

         - name: Cache Intel macOS Rust compilation
           if: matrix.id == 'darwin-x64'
           uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
           with:
              prefix-key: scient-native-v1
              key: ${{ matrix.id }}-both-${{ hashFiles('packages/natives/scripts/**', 'scripts/bazel-natives.ts', 'scripts/host-detect.ts', 'scripts/scient/native-variant.ts', 'scripts/stamp-native-version.ts') }}
              env-vars: CARGO CC CFLAGS CXX CMAKE RUST SDKROOT MACOSX_DEPLOYMENT_TARGET ImageOS ImageVersion
              cache-bin: false
              cache-on-failure: true

         - name: Check the generated commits and types
           if: matrix.id == 'darwin-arm64'
           run: |
              bun scripts/scient/rename-identity.ts --check
              bun scripts/scient/rename-wording.ts --check
              bun run check:ts

         # On x86-64 the binary carries two addons and picks one at startup:
         # `modern` (AVX2) and `baseline`, for processors without AVX2.
         - name: Build the baseline native addon
           if: matrix.x64
           run: PI_NATIVE_X64_VARIANT=baseline bun run build:native

         - name: Build the modern native addon
           if: matrix.x64
           run: PI_NATIVE_X64_VARIANT=modern bun run build:native

         - name: Build the native addon
           if: ${{ !matrix.x64 }}
           run: bun run build:native

         # Scient's own tests, and the packages whose state layout differs by
         # platform. Oh My Pi's whole suite runs on Linux (upstream-tests).
         - name: Test Scient's code
           if: matrix.id == 'darwin-arm64'
           run: |
              bun --cwd=packages/utils test
              bun --cwd=packages/natives test
              bun --cwd=packages/coding-agent test test/scient
              bun --cwd=packages/ai test test/scient
              bun test scripts/scient

         - name: Build the binary
           run: |
              bun --cwd=packages/coding-agent run build
              binary=packages/coding-agent/dist/scient-agent
              [ -f "$binary.exe" ] && binary="$binary.exe"
              echo "BINARY=$binary" >> "$GITHUB_ENV"
              "$binary" --version < /dev/null

         - name: Check the build reports scient.json's version
           if: env.RELEASE == 'true'
           run: |
              version="$("$BINARY" --version < /dev/null)"
              test "$version" = "scient-agent/$(bun -e 'console.log((await Bun.file("scient.json").json()).version)')"

         - name: Check state isolation
           run: bun scripts/scient/isolation-check.ts "$BINARY"

         - name: Package
           run: |
              name="scient-agent-${{ matrix.id }}"
              [ "${{ runner.os }}" = "Windows" ] && name="$name.exe"
              mkdir -p release
              cp "$BINARY" "release/$name"
              # A macOS build is checksummed once it is signed (sign-macos).
              [ "${{ runner.os }}" = "macOS" ] && exit 0
              bun -e 'const [file] = process.argv.slice(1); const hash = new Bun.CryptoHasher("sha256"); hash.update(await Bun.file(file).arrayBuffer()); console.log(`${hash.digest("hex")}  ${file.split("/").pop()}`);' "release/$name" > "release/$name.sha256"
              cat "release/$name.sha256"

         - uses: actions/upload-artifact@v4
           with:
              # The release collects `scient-agent-*` artifacts only, so an
              # unsigned macOS build can never be published.
              name: ${{ runner.os == 'macOS' && 'unsigned-' || '' }}scient-agent-${{ matrix.id }}
              path: release/
              if-no-files-found: error

   # Oh My Pi's own tests, run as its CI runs them, on Scient's tree: a change
   # Scient makes must not break what upstream's tests hold.
   natives-linux:
      name: Build the native addon for Oh My Pi's tests
      runs-on: ubuntu-22.04
      timeout-minutes: 60
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.4

         - name: Build the native addon
           run: |
              sudo apt-get update && sudo apt-get install -y ninja-build
              rustup show active-toolchain || rustup toolchain install
              bun install --frozen-lockfile
              PI_NATIVE_X64_VARIANT=baseline bun run build:native
              PI_NATIVE_X64_VARIANT=modern bun run build:native

         - uses: actions/upload-artifact@v4
           with:
              name: natives-linux-x64
              path: packages/natives/native/*.node
              if-no-files-found: error
              retention-days: 1

   upstream-tests:
      name: Oh My Pi's tests (${{ matrix.mode }})
      needs: natives-linux
      runs-on: ubuntu-22.04
      timeout-minutes: 40
      strategy:
         fail-fast: false
         matrix:
            include:
               - { mode: workspace, concurrency: 4 }
               - { mode: native, concurrency: 4 }
               - { mode: coding-agent-singleton, concurrency: 1 }
               - { mode: coding-agent-ui, concurrency: 2 }
               - { mode: coding-agent-runtime, concurrency: 4 }
               - { mode: coding-agent-native, concurrency: 4 }
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.4

         - name: Install dependencies
           run: bun install --frozen-lockfile

         - uses: actions/download-artifact@v4
           with:
              name: natives-linux-x64
              path: packages/natives/native

         # Upstream's bucket, unchanged; only failures that untouched upstream has too may pass (see the script).
         - name: Test
           env:
              OMP_TEST_CONCURRENCY: ${{ matrix.concurrency }}
              OMP_TEST_TIMEOUT: "120"
           run: bun scripts/scient/upstream-tests.ts ${{ matrix.mode }}

         # Upstream's workspace job also runs its release-script test and a CLI smoke test.
         - name: Test the release script and the CLI
           if: matrix.mode == 'workspace'
           run: |
              bun test scripts/release.test.ts
              bun run ci:test:smoke

   divergence:
      name: Check Scient's divergences
      runs-on: ubuntu-24.04
      timeout-minutes: 90
      steps:
         # The pull request's own head, not GitHub's merge commit: the check walks
         # Scient's linear history from the accepted alignment.
         - uses: actions/checkout@v4
           with:
              ref: ${{ github.event.pull_request.head.sha || github.sha }}
              fetch-depth: 0

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.4

         # The checker parses with the locked @babel/parser: without an install, Bun
         # would fetch whatever version is newest when the job runs.
         - name: Install dependencies
           run: bun install --frozen-lockfile --ignore-scripts

         - name: Fetch the accepted alignments
           run: git fetch --force --no-tags origin 'refs/tags/omp-sync/*:refs/tags/omp-sync/*'

         - name: Check
           run: |
              version="$(bun -e 'console.log((await Bun.file("scient.json").json()).upstream.version)')"
              if git rev-parse -q --verify "refs/tags/omp-sync/v$version" > /dev/null; then
                 bun scripts/scient/divergence-check.ts
              else
                 # An alignment with a new release: check its replay, which regenerates
                 # the generated commits (they format Rust with the pinned toolchain).
                 rustup show active-toolchain || rustup toolchain install
                 git fetch --no-tags origin "refs/heads/replay/omp-v$version:refs/remotes/origin/replay/omp-v$version"
                 bun scripts/scient/divergence-check.ts --replay "origin/replay/omp-v$version"
              fi

   sign-macos:
      name: Sign (${{ matrix.id }})
      needs: build
      # Upstream's signer runs on Linux: it fetches a pinned linux-musl rcodesign.
      runs-on: ubuntu-22.04
      # Notarization may wait up to three times 30 minutes (scripts/ci-macos-sign.sh).
      timeout-minutes: 120
      strategy:
         fail-fast: false
         matrix:
            id: [darwin-arm64, darwin-x64]
      steps:
         - uses: actions/checkout@v4

         - uses: actions/download-artifact@v4
           with:
              name: unsigned-scient-agent-${{ matrix.id }}
              path: release

         - name: Sign ad hoc
           if: env.DEVELOPER_ID != 'true'
           run: bash scripts/ci-macos-sign.sh "release/scient-agent-${{ matrix.id }}"

         - name: Sign with the Developer ID and notarize
           if: env.DEVELOPER_ID == 'true'
           # The same secrets, in the same form, as Scient Desktop's release.
           env:
              CSC_LINK: ${{ secrets.CSC_LINK }}
              CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
              APPLE_API_KEY_TEXT: ${{ secrets.APPLE_API_KEY }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
           run: |
              for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_TEXT APPLE_API_KEY_ID APPLE_API_ISSUER; do
                 if [ -z "${!name}" ]; then
                    echo "::error::Developer ID signing needs the Apple signing secrets ($name is missing); an ad-hoc signed binary is not publishable."
                    exit 1
                 fi
              done
              # scripts/ci-macos-sign.sh takes the certificate and the key as base64.
              APPLE_CERTIFICATE_P12="$CSC_LINK" \
              APPLE_CERTIFICATE_PASSWORD="$CSC_KEY_PASSWORD" \
              APPLE_API_KEY="$(printf '%s' "$APPLE_API_KEY_TEXT" | base64 | tr -d '\n')" \
              APPLE_API_ISSUER_ID="$APPLE_API_ISSUER" \
                 bash scripts/ci-macos-sign.sh "release/scient-agent-${{ matrix.id }}"

         - name: Checksum
           working-directory: release
           run: sha256sum "scient-agent-${{ matrix.id }}" | tee "scient-agent-${{ matrix.id }}.sha256"

         - uses: actions/upload-artifact@v4
           with:
              name: scient-agent-${{ matrix.id }}
              path: release/
              if-no-files-found: error

   # Runs the exact signed bytes the release publishes on their own platform.
   verify-macos:
      name: Check signed build (${{ matrix.id }})
      needs: sign-macos
      runs-on: ${{ matrix.runner }}
      timeout-minutes: 30
      strategy:
         fail-fast: false
         matrix:
            include:
               - { id: darwin-arm64, runner: macos-15 }
               - { id: darwin-x64, runner: macos-15-intel }
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.4

         - uses: actions/download-artifact@v4
           with:
              name: scient-agent-${{ matrix.id }}
              path: release

         - name: Check the signature
           run: |
              (cd release && shasum -a 256 -c "scient-agent-${{ matrix.id }}.sha256")
              binary="release/scient-agent-${{ matrix.id }}"
              chmod +x "$binary"
              echo "BINARY=$binary" >> "$GITHUB_ENV"
              codesign --verify --strict --verbose=2 "$binary"
              info="$(codesign -dvvv "$binary" 2>&1)"
              echo "$info"
              if [ "$DEVELOPER_ID" = "true" ] && grep -qE "flags=.*adhoc|Signature=adhoc" <<< "$info"; then
                 echo "::error::$binary is ad-hoc signed; Developer ID signing did not run."
                 exit 1
              fi
              "$binary" --version < /dev/null

         - name: Check the build reports scient.json's version
           if: env.RELEASE == 'true'
           run: |
              version="$("$BINARY" --version < /dev/null)"
              test "$version" = "scient-agent/$(bun -e 'console.log((await Bun.file("scient.json").json()).version)')"

         - name: Check state isolation
           run: bun scripts/scient/isolation-check.ts "$BINARY"

   # Each binary's zstd copy, about 40% of its size, which Scient Desktop
   # downloads first. Made from the bytes the release publishes (signed, for
   # macOS) on every run, so every pull request proves it unpacks to them.
   compress:
      name: Compress the binaries
      needs: [build, sign-macos]
      runs-on: ubuntu-24.04
      timeout-minutes: 45
      steps:
         - uses: actions/download-artifact@v4
           with:
              pattern: scient-agent-*
              path: release
              merge-multiple: true

         - name: Compress
           working-directory: release
           run: |
              set -euo pipefail
              zstd --version
              mkdir ../compressed
              for binary in scient-agent-*; do
                 case "$binary" in *.sha256 | *.zst) continue ;; esac
                 sha256sum -c "$binary.sha256"
                 # A window of 2^27 (128 MiB): Desktop refuses a copy that needs more.
                 zstd -q -19 --long=27 -T0 "$binary" -o "../compressed/$binary.zst"
                 unpacked="$(zstd -q -d --long=27 -c "../compressed/$binary.zst" | sha256sum | cut -d' ' -f1)"
                 if [ "$unpacked" != "$(cut -d' ' -f1 "$binary.sha256")" ]; then
                    echo "::error::$binary.zst does not unpack to $binary."
                    exit 1
                 fi
                 (cd ../compressed && sha256sum "$binary.zst" | tee "$binary.zst.sha256")
              done
              ls -l . ../compressed

         - uses: actions/upload-artifact@v4
           with:
              # `scient-agent-*`, so the release collects it.
              name: scient-agent-compressed
              path: compressed/
              if-no-files-found: error

   release:
      name: Draft release
      # Job conditions cannot read workflow env, so this repeats RELEASE.
      if: github.event_name == 'workflow_dispatch' && inputs.release
      needs: [release-version, build, verify-macos, compress, divergence, upstream-tests]
      runs-on: ubuntu-24.04
      permissions:
         contents: write
      env:
         VERSION: ${{ needs.release-version.outputs.version }}
         TAG: v${{ needs.release-version.outputs.version }}
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.4

         # The run takes an hour or more; a release may have been published meanwhile.
         - name: Check the version is still next
           env:
              GH_TOKEN: ${{ github.token }}
           run: bun scripts/scient/release-version.ts

         - uses: actions/download-artifact@v4
           with:
              pattern: scient-agent-*
              path: release
              merge-multiple: true

         # A draft that was never published holds no tag and does not use its
         # version up: this run's draft replaces it.
         - name: Replace an unpublished draft of this version
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              set -euo pipefail
              drafts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")"
              for id in $drafts; do
                 echo "Deleting the unpublished draft $id of $TAG."
                 gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done

         # Publishing the draft creates the tag on the commit built here; until
         # then no tag exists, so the version is not used up.
         - name: Create the draft release
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              set -euo pipefail
              ls -l release
              gh release create "$TAG" release/* \
                 --repo "$GITHUB_REPOSITORY" \
                 --draft \
                 --target "$GITHUB_SHA" \
                 --title "Scient Agent $VERSION" \
                 --notes "Built from ${GITHUB_SHA}."
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
                 echo "::error::Drafting $TAG created its tag; the version would be used up before it is published."
                 exit 1
              fi

         # Scient Desktop downloads from Scient's own copy first and falls back to
         # this release, so a GitHub outage doesn't block installs. Its catalog
         # publishes a version only after every copy here matches the digest. A
         # run that replaces an unpublished draft overwrites that draft's copy.
         - name: Copy the release to downloads.scientfactory.com
           env:
              AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
              AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
              AWS_DEFAULT_REGION: auto
              # R2 refuses the checksum headers newer AWS CLIs add by default.
              AWS_REQUEST_CHECKSUM_CALCULATION: when_required
              AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
              R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
              R2_BUCKET: ${{ vars.R2_DOWNLOADS_BUCKET }}
           run: |
              set -euo pipefail
              for name in R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_BUCKET; do
                 if [ -z "${!name}" ]; then echo "::error::$name is not set; Scient's copy was not uploaded." >&2; exit 1; fi
              done
              aws s3 cp release/ "s3://$R2_BUCKET/scient-agent/$TAG/" --recursive \
                 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
                 --content-type application/octet-stream \
                 --cache-control "public, max-age=3600"
              for file in release/*; do
                 echo "https://downloads.scientfactory.com/scient-agent/$TAG/$(basename "$file")"
              done
