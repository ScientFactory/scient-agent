name: Scient quality

on:
  push:
    branches: [dev, release/stable]
  pull_request:
    branches: [dev, release/stable]
  workflow_dispatch:

concurrency:
  group: scient-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-quality:
    name: Scient source quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Verify Scient public identity
        run: bun run scient:identity-check

      - name: Verify workflow isolation and immutable actions
        run: bun run scient:workflow-check

      - name: Verify Scient upstream ownership and review state
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git remote set-url --push upstream DISABLED
          bun run scient:upstream-check

      - name: Configure Git identity
        run: |
          git config --global user.email "scient-ci@users.noreply.github.com"
          git config --global user.name "Scient CI"

      - name: Typecheck workspace
        run: bun turbo typecheck

      - name: Test inherited agent core
        working-directory: packages/opencode
        run: |
          # These inherited integration files are resource-sensitive. Give them
          # controlled fresh processes while still running every test.
          bun test --timeout 60000 --only-failures \
            --path-ignore-patterns test/server/httpapi-v2-pty.test.ts \
            --path-ignore-patterns test/cli/run/run-process.test.ts
          bun test --timeout 60000 --only-failures test/server/httpapi-v2-pty.test.ts
          bun test --timeout 60000 --only-failures --max-concurrency 2 test/cli/run/run-process.test.ts

      - name: Build Scient agent source
        working-directory: packages/opencode
        run: bun run build

      - name: Smoke inherited CLI core
        working-directory: packages/opencode
        run: bun run dev --version
